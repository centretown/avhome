<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width" />
        <script src="/reader.js"></script>
        <style>
            body {
                background-color: black;
            }
            .video {
                position: fixed;
                left: 1px;
                top: 1px;
                width: 540px;
            }
            .canvas {
            }
            .message {
                color: orangered;
            }
            .group {
            }
            .hide {
                display: none;
            }
        </style>
    </head>
    <body>
        <div id="cam5-message" class="message"></div>
        <div class="group">
            <video
                id="cam5-video"
                class="video"
                controls
                muted
                autoplay
            ></video>
            <canvas id="cam5-canvas" class="canvas" width="2560" height="1440"></canvas>
        </div>
        <script src="/home.js"></script>
        <script src="/paths.js"></script>
        <script>
            window.addEventListener("load", () => {
                loadPaths();
            });
            window.addEventListener("beforeunload", () => {
                console.log("closing readers...");
                for (let reader of readers) {
                    if (reader !== null) {
                        console.log("closing: ", reader.url);
                        reader.close();
                    }
                }
            });
        </script>
    </body>
</html>
