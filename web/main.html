<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width" />
        <style>
            html,
            body {
                margin: 0;
                padding: 0;
                height: 100%;
                font-family: "Arial", sans-serif;
            }
            .main-video {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgb(30, 30, 30);
            }
            #message {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                height: 100%;
                display: flex;
                align-items: center;
                text-align: center;
                justify-content: center;
                font-size: 16px;
                font-weight: bold;
                color: white;
                pointer-events: none;
                padding: 20px;
                box-sizing: border-box;
                text-shadow: 0 0 5px black;
            }
        </style>
        <script src="./reader.js"></script>
    </head>
    <body>
        <video
            id="video"
            class="main-video"
            controls
            muted
            autoplay
            playsinline
            width="640"
            height="480"
        ></video>
        <div id="message"></div>

        <script>
            const video = document.getElementById("video");
            const message = document.getElementById("message");

            let defaultControls = true;
            let reader = null;
            const setMessage = (str) => {
                if (str !== "") {
                    video.controls = false;
                } else {
                    video.controls = defaultControls;
                }
                message.innerText = str;
            };
            window.addEventListener("load", () => {
                reader = new MediaMTXWebRTCReader({
                    url: "http://192.168.7.188:8889/cam1/whep",
                    user: "", // fill if needed
                    pass: "", // fill if needed
                    token: "", // fill if needed
                    onError: (err) => {
                        setMessage(err);
                    },
                    onTrack: (evt) => {
                        setMessage("");
                        video.srcObject = evt.streams[0];
                    },
                    onDataChannel: (evt) => {
                        evt.channel.binaryType = "arraybuffer";
                        evt.channel.onmessage = (evt) => {
                            console.log("data channel message", evt.data);
                        };
                    },
                });
            });

            window.addEventListener("beforeunload", () => {
                if (reader !== null) {
                    reader.close();
                }
            });
        </script>
    </body>
</html>
