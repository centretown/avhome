{{define "main"}}
<!---->
<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width" />
        <link rel="stylesheet" href="/static/css/home.css" />
        <link rel="stylesheet" href="/static/css/weather.css" />
        <script src="/static/js/htmx.js"></script>
        <script src="/static/js/ws.js"></script>
        <script src="/static/js/reader.js"></script>
        <script src="/static/home.js"></script>
    </head>
    <body>
        <span id="events" hx-ext="ws" ws-connect="/events">
            <div class="container">{{template "main.view" .}}</div>
        </span>
        {{template "mtxpaths" .}}
        <script>
            const contentView = document.getElementById("main-content");
            const summaryView = document.getElementById("summary");
            const listView = document.getElementById("side-list");

            let windowWidth = window.innerWidth;
            let windowHeight = window.innerHeight;
            reportWindowSize();
            window.addEventListener("load", () => {
                loadPaths();
                console.log(mtx_paths);
            });

            window.addEventListener("beforeunload", () => {
                console.log("closing readers...");
                for (let reader of readers) {
                    if (reader !== null) {
                        console.log("closing: ", reader.url);
                        reader.close();
                    }
                }
            });

            window.onresize = reportWindowSize;
            function reportWindowSize() {
                windowWidth = (window.innerWidth * 4) / 5;
                windowHeight = window.innerHeight;
                console.log(windowWidth, windowHeight);
                console.log(summaryView.style.height);

                let h = windowHeight - 96;
                console.log("height:", h);
                listView.style.height = "" + h + "px";
                console.log(listView.style.height);
            }
        </script>
    </body>
</html>
{{end}}
