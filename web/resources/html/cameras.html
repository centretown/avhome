{{ define "camera.list" }}
<!---->
{{range $cam := .Paths.Items}} {{template "camera.video" $cam}} {{end}}
<!---->
{{end}}
<!---->

{{ define "camera.video"}}
<div class="">
    <div class="w3-blue-gray w3-padding-small w3-round-small">Camera: {{.Name}}</div>
    <video
        id="video-{{.Name}}"
        class="list"
        controls
        muted
        autoplay
        playsinline
    ></video>
    <div id="message-{{.Name}}" class="message"></div>
</div>
{{end}}
<!---->
